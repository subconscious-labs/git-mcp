run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - bodyclose
    - gosec
    - errorlint
    - nilerr
    - exhaustive

linters-settings:
  gosec:
    excludes:
      - G204 # exec.Command with variables is expected in this project
  revive:
    rules:
      - name: exported
        disabled: true
